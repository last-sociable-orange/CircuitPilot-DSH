# ============================================================================
# CircuitPilot — a DSH agent preset that replicates the Pi "CircuitPilot" setup
# ----------------------------------------------------------------------------
#   Pi (project-local)                     ->  DSH (this preset)
#     AGENTS.md (lead prompt)              ->  AGENTS.md, via dsh-agent-instructions
#     .pi/agents/worker.md   (:high)       ->  subagent_worker   (high)
#     .pi/agents/designer.md (:high)       ->  subagent_designer (high)
#     .pi/agents/reviewer.md (:high)       ->  subagent_reviewer (high)
#     .pi/extensions/subagents/            ->  the tool-subagent rows below
#     .pi/skills/                          ->  .dsh/skills/  (discovered automatically)
#
# NO PROJECT PATHS APPEAR ANYWHERE IN THIS FILE.
#
#   * Role prompts are read by each child agent at delegation time, from
#     `<workspace>/.dsh/agents/<role>.md` — the child inherits the delegating
#     session's working directory, so this resolves per project with no
#     configuration. That is also why this file needs no `persona` reads.
#   * Skills come from the project-root convention `<projectRoot>/.dsh/skills`
#     that `dsh-skill-filesystem` already scans by default.
#   * `AGENTS.md` is loaded from the project root by `dsh-agent-instructions`.
#
# Deploying to a new hardware project is therefore file-only: give it an
# AGENTS.md, a `.dsh/agents/{worker,designer,reviewer}.md`, and a
# `.dsh/skills/` tree. Nothing in the DSH profile changes.
#
# A patch replaces the targeted row's whole `config`; this file only INSERTS, so
# nothing shipped by dsh-base / dsh-web-app changes.
# ============================================================================

- insert:
    - id: preset-circuitpilot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: circuitpilot
        name: CircuitPilot
        description: >-
          Hardware project lead with three sub-agents: worker (datasheets + KiCad
          libraries), designer (part research + design documents), reviewer
          (independent schematic review). Roles are read from .dsh/agents/.
        order: 2
        plugins:
          # ── identity ────────────────────────────────────────────────────────
          # Deliberately short: the real instructions live in the project's
          # AGENTS.md, loaded by the agent-instructions row below.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are CircuitPilot, the lead agent of a hardware (electronics)
                design team. Follow the workspace instructions in AGENTS.md, which
                define your sub-agents and the delegation rules.
              suffix: >-
                Your working directory is {{cwd}}.

          # ── AGENTS.md at the project root is the lead agent's prompt ────────
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── Lead toolset ────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !<tag:yaml.org,2002:js> process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !<tag:yaml.org,2002:js> process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── Skills ──────────────────────────────────────────────────────────
          # No `customSkillDirs`: the provider's default roots are used, so a
          # project's skills live at `<projectRoot>/.dsh/skills/<name>/SKILL.md`
          # and need no declaration here. `includeDefaultRoots` defaults to
          # true.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── Planning / compaction: same shape as the shipped standard preset ─
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask the user "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── Delegation: 1 generic + 3 named sub-agents ──────────────────────
          #
          # Each named agent is one `tool-subagent` row. The row fixes the
          # agent's model and thinking level (Pi's `model:` frontmatter); the
          # persona is fixed and project-independent, and it makes the child load
          # its role definition from the project before working:
          #
          #     <workspace>/.dsh/agents/worker.md
          #
          # The child inherits this session's working directory, so one preset
          # serves every hardware project.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: subagent-worker
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_worker
                  backgroundMode: continuable
                  persona: >-
                    You are the WORKER agent of a hardware design team. Before doing
                    anything else, read the file `.dsh/agents/worker.md` in your working
                    directory and adopt it as your role definition; it is authoritative
                    and overrides any assumption you would otherwise make about this
                    job. If that file is missing, say so and stop. Then carry out the
                    task exactly as that definition and the delegating lead describe.
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

              - id: subagent-designer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_designer
                  backgroundMode: continuable
                  persona: >-
                    You are the DESIGNER agent of a hardware design team. Before doing
                    anything else, read the file `.dsh/agents/designer.md` in your working
                    directory and adopt it as your role definition; it is authoritative
                    and overrides any assumption you would otherwise make about this
                    job. If that file is missing, say so and stop. Then carry out the
                    task exactly as that definition and the delegating lead describe.
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

              - id: subagent-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_reviewer
                  backgroundMode: continuable
                  persona: >-
                    You are the REVIEWER agent of a hardware design team. Before doing
                    anything else, read the file `.dsh/agents/reviewer.md` in your working
                    directory and adopt it as your role definition; it is authoritative
                    and overrides any assumption you would otherwise make about this
                    job. If that file is missing, say so and stop. Then carry out the
                    task exactly as that definition and the delegating lead describe.
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

          # ── Remaining standard toolset ──────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !<tag:yaml.org,2002:js> "!ctx.get('profileContext')"
