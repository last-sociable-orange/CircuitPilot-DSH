# ============================================================================
# CircuitPilot — a DSH agent preset that replicates the Pi "CircuitPilot" setup
# ----------------------------------------------------------------------------
#   Pi (project-local)                     ->  DSH (this bundle)
#     AGENTS.md (lead prompt)              ->  AGENTS.md, via dsh-agent-instructions
#     .pi/agents/{worker,designer,reviewer}.md
#                                          ->  <project>/.dsh/agents/*.md, read by
#                                              the child itself; the bundle only
#                                              wires the delegation tools
#     .pi/extensions/subagents/            ->  the tool-subagent rows below
#     .pi/skills/                          ->  .dsh/skills/  (discovered automatically)
#
# NO PROJECT PATHS APPEAR ANYWHERE IN THIS FILE, AND NO ROLE TEXT EITHER.
#
#   * Role prompts are read by each child agent at delegation time, from
#     `<workspace>/.dsh/agents/<role>.md` — the child inherits the delegating
#     session's working directory, so this resolves per project with no
#     configuration. Adding or rewriting a role is a Markdown edit.
#   * Skills come from the project-root convention `<projectRoot>/.dsh/skills`
#     that `dsh-skill-filesystem` scans by default (`includeDefaultRoots`).
#   * `AGENTS.md` is loaded from the project root by `dsh-agent-instructions`.
#
# Deploying to a new hardware project is therefore file-only: give it an
# AGENTS.md, a `.dsh/agents/{worker,designer,reviewer}.md`, and a
# `.dsh/skills/` tree. Nothing in the DSH profile changes.
#
# A patch replaces the targeted row's whole `config`; this file only INSERTS, so
# nothing shipped by dsh-base / dsh-web-app changes.
#
# ----------------------------------------------------------------------------
# DSH 0.2.2 shape (migrated from the 0.2.0-era patch; see the bundle README):
#
#   1. `@deepseek-ai/dsh-tool-subagent` no longer accepts `persona` or
#      `toolFilter` (upgrade guide v0.2.1-alpha.1/subagent-preset-composition).
#      There is therefore NO per-child composition here: a spawn child with no
#      `agentPreset` joins the parent's active revision, so every delegated
#      sub-agent runs this same preset.
#
#      ROLE ASSIGNMENT IS A MARKDOWN ACT. The lead names the role-definition
#      file in each task (`<project>/.dsh/agents/<role>.md`) and the child adopts
#      it; AGENTS.md carries the matching "if you are a sub-agent" paragraph, so
#      the inherited lead composition is reconciled in prose instead of in the
#      composition. Adding a role is a Markdown edit and a row in AGENTS.md.
#   2. `backgroundMode` / `enableRunInBackground` are gone
#      (v0.2.1-alpha.1/subagent-activations): every delegation is a managed
#      activation that reports back through a completion notice.
#   3. `dsh-tool-subagent-control` registers `send_message`, `interrupt_agent`,
#      `wait_agent` and `list_agents` together, and its `/list-agents` export is
#      removed (v0.2.1-rc.1/subagent-control-tools). One row replaces the old
#      pair, with `interrupt: false` as the shipped presets use
#      (v0.2.2-rc.1/subagent-interrupt-default).
#   4. `dsh-persona` interpolates `{{variable}}` strictly and only `provider` and
#      `model` are registered by the agent loop, so the old
#      `Your working directory is {{cwd}}.` suffix failed prompt assembly on
#      every turn. The working directory reaches the agent as runtime context
#      from `dsh-working-directory` instead.
# ============================================================================

- insert:
    # ── Lead ────────────────────────────────────────────────────────────────
    - id: preset-circuitpilot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: circuitpilot
        name: CircuitPilot
        description: >-
          Hardware project lead with three sub-agents: worker (datasheets + KiCad
          libraries), designer (part research + design documents), reviewer
          (independent schematic review). Roles are read from .dsh/agents/.
        order: 2
        plugins:
          # ── identity ────────────────────────────────────────────────────────
          # The role section below is the only identity text, and it resolves per
          # assembling agent (`dsh-circuitpilot/role-persona`):
          #   lead (root)      -> empty, so the section renders away; the lead's
          #                       instructions are the project's AGENTS.md.
          #   delegated child  -> the contents of `.dsh/agents/<child name>.md`,
          #                       i.e. its own prompt, injected at creation.
          # No `dsh-persona` row: this profile also runs `dsh-agent-persona`,
          # which owns the persona slot per agent and can replace it.

          # Injects the role file above. Reads the child's working directory and
          # the agent name the lead assigned, so the Markdown stays the only
          # place a role is defined.
          - id: role-persona
            name: 'dsh-circuitpilot/role-persona'
            config:
              roleDir: .dsh/agents

          # ── AGENTS.md at the project root is the lead agent's prompt ────────
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── Lead toolset ────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── Skills ──────────────────────────────────────────────────────────
          # No `customSkillDirs`: the provider's default roots are used, so a
          # project's skills live at `<projectRoot>/.dsh/skills/<name>/SKILL.md`
          # and need no declaration here. `includeDefaultRoots` defaults to
          # true.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── Planning / compaction: same shape as the shipped standard preset ─
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── Delegation: 1 generic + 3 named sub-agents ──────────────────────
          #
          # Four `tool-subagent` rows over the `spawn` provider. A row fixes only
          # the model-facing tool name and, for the named ones, the model and
          # thinking level (Pi's `model:` frontmatter). No row selects or
          # describes a role: the child joins this preset's revision and the lead
          # assigns the role by naming `.dsh/agents/<role>.md` in the task.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: subagent-worker
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_worker
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

              - id: subagent-designer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_designer
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

              - id: subagent-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_reviewer
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

              # CAD: netlist -> KiCad schematic pages. Never writes schematic text;
              # drives the vendored KiCAD-MCP server through the kicad-sch-build skill
              # and is accepted only when KiCad's own netlist read-back matches.
              - id: subagent-cad
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent_cad
                  agentOptions:
                    provider: deepseek-account
                    model: deepseek-flash
                    reasoningEffort: high

          # ── Remaining standard toolset ──────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"

    # No second preset on purpose. A delegated child joins this revision, so the
    # child inherits this toolset and the lead persona; the role it plays is the
    # Markdown file the lead names in the task, reconciled by the
    # "if you are a sub-agent" paragraph in the project's AGENTS.md.
