[project]
name = "schwrite"
version = "1.0.2"
description = "Netlist-driven KiCad schematic page generator (SW-PLAN-SCHWRITE-001)"
readme = "README.md"
requires-python = ">=3.10"
# No runtime dependencies: the S-expression reader is vendored under
# src/schwrite/_vendor/sexpdata.py (BSD-2-Clause, see _vendor/LICENSE.sexpdata).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
schwrite = "schwrite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwrite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
