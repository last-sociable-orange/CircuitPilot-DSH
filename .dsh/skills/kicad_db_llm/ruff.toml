# Lint settings for this skill (standard library only, Python 3.10+).

target-version = "py310"
line-length = 100
extend-exclude = [".wip", ".trash", ".review"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are allowed where they keep a message readable
    "RUF001", # Ω, ±, ℃ and Chinese characters in part data are legitimate
    "RUF002",
    "RUF003",
    "SIM102",
]
